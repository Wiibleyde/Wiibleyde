<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" fill="none">
  <style>
    .name { font: 800 76px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; letter-spacing: -2px; }
    .aka  { font: 500 22px 'JetBrains Mono', 'Fira Code', 'Cascadia Code', Consolas, 'Courier New', monospace; fill: #8b949e; }
    .cmd  { font: 500 18px 'JetBrains Mono', 'Fira Code', 'Cascadia Code', Consolas, 'Courier New', monospace; fill: #34d399; }
    .role { font: 600 26px 'JetBrains Mono', 'Fira Code', 'Cascadia Code', Consolas, 'Courier New', monospace; fill: #e6edf3; }
    .chip { font: 600 15px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #c9d1d9; }
    .orb  { font: 800 17px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
    .blob { animation: drift 14s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
    .b2 { animation-duration: 18s; animation-delay: -6s; }
    .b3 { animation-duration: 22s; animation-delay: -3s; }
    @keyframes drift { 0% { transform: translate(0,0) scale(1); } 50% { transform: translate(60px,-30px) scale(1.15); } 100% { transform: translate(-40px,30px) scale(.9); } }
    .tw { animation: tw 3s ease-in-out infinite; }
    @keyframes tw { 0%,100% { opacity: .15; } 50% { opacity: 1; } }
    .spin { animation: spin 40s linear infinite; transform-origin: 960px 200px; }
    .spin-r { animation: spin 60s linear infinite reverse; transform-origin: 960px 200px; }
    .counter { animation: spin 40s linear infinite reverse; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .pulse { animation: pulse 3s ease-in-out infinite; transform-origin: 960px 200px; }
    @keyframes pulse { 0%,100% { transform: scale(1); opacity: .9; } 50% { transform: scale(1.06); opacity: 1; } }
    .fade { opacity: 0; animation: in .9s ease-out forwards; }
    @keyframes in { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0b0f19"/><stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#a78bfa"/><stop offset=".5" stop-color="#22d3ee"/><stop offset="1" stop-color="#f472b6"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-.5 0;.5 0;-.5 0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#a78bfa"/><stop offset="1" stop-color="#22d3ee" stop-opacity=".2"/>
    </linearGradient>
    <radialGradient id="core"><stop stop-color="#a78bfa" stop-opacity=".9"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></radialGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#ffffff" stroke-opacity=".05"/>
    </pattern>
    <radialGradient id="gridfade" cx=".5" cy=".5" r=".7"><stop stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <mask id="gm"><rect width="1200" height="400" fill="url(#gridfade)"/></mask>
    <clipPath id="frame"><rect width="1200" height="400" rx="24"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="400" fill="url(#bg)"/>
    <g filter="url(#blur)" opacity=".55">
      <circle class="blob" cx="260" cy="90" r="140" fill="#a78bfa"/>
      <circle class="blob b2" cx="900" cy="330" r="150" fill="#22d3ee"/>
      <circle class="blob b3" cx="640" cy="40" r="110" fill="#f472b6"/>
    </g>
    <rect width="1200" height="400" fill="url(#grid)" mask="url(#gm)"/>
    <circle cx="640" cy="60" r="1.2" fill="#fff" class="tw" style="animation-delay:0s"/><circle cx="720" cy="330" r="1" fill="#fff" class="tw" style="animation-delay:1.2s"/><circle cx="560" cy="350" r="1.4" fill="#fff" class="tw" style="animation-delay:2.1s"/><circle cx="1150" cy="40" r="1" fill="#fff" class="tw" style="animation-delay:0.6s"/><circle cx="1100" cy="360" r="1.3" fill="#fff" class="tw" style="animation-delay:1.8s"/><circle cx="470" cy="40" r="1" fill="#fff" class="tw" style="animation-delay:2.6s"/><circle cx="1170" cy="200" r="1.1" fill="#fff" class="tw" style="animation-delay:0.3s"/><circle cx="610" cy="200" r="0.9" fill="#fff" class="tw" style="animation-delay:1.5s"/>

    <!-- orbit -->
    <circle cx="960" cy="200" r="70" fill="url(#core)" class="pulse"/>
    <g class="spin-r"><circle cx="960" cy="200" r="160" stroke="url(#ring)" stroke-opacity=".35" stroke-dasharray="2 10"/></g>
    <circle cx="960" cy="200" r="120" stroke="url(#ring)" stroke-width="1.5" stroke-opacity=".6"/>
    <g class="spin"><g transform="translate(960 200)"><g transform="rotate(0)"><g transform="translate(0 -120)">
          <g transform="rotate(0)"><g class="counter"><circle r="22" fill="#0d1117" stroke="#3178c6" stroke-width="2"/>
          <text y="6" text-anchor="middle" class="orb" fill="#3178c6">TS</text></g></g></g></g><g transform="rotate(90)"><g transform="translate(0 -120)">
          <g transform="rotate(-90)"><g class="counter"><circle r="22" fill="#0d1117" stroke="#00add8" stroke-width="2"/>
          <text y="6" text-anchor="middle" class="orb" fill="#00add8">Go</text></g></g></g></g><g transform="rotate(180)"><g transform="translate(0 -120)">
          <g transform="rotate(-180)"><g class="counter"><circle r="22" fill="#0d1117" stroke="#f40552" stroke-width="2"/>
          <text y="6" text-anchor="middle" class="orb" fill="#f40552">5M</text></g></g></g></g><g transform="rotate(270)"><g transform="translate(0 -120)">
          <g transform="rotate(-270)"><g class="counter"><circle r="22" fill="#0d1117" stroke="#5b6bff" stroke-width="2"/>
          <text y="6" text-anchor="middle" class="orb" fill="#5b6bff">Lua</text></g></g></g></g></g></g>
    <text x="960" y="214" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', 'Cascadia Code', Consolas, 'Courier New', monospace" font-weight="800" font-size="40" fill="#fff">&lt;/&gt;</text>

    <!-- text -->
    <text x="80" y="92" class="cmd fade">~/wiibleyde <tspan fill="#8b949e">$</tspan> <tspan fill="#e6edf3">whoami</tspan></text>
    <text x="76" y="172" class="name fade" style="animation-delay:.2s" fill="url(#txt)">Nathan Bonnell</text>
    <text x="82" y="210" class="aka fade" style="animation-delay:.4s">a.k.a. <tspan fill="#a78bfa" font-weight="700">Wiibleyde</tspan></text>
    
    <clipPath id="c0"><rect x="80" y="236" height="40" width="0">
      <animate attributeName="width" dur="24.0s" repeatCount="indefinite" calcMode="linear"
        keyTimes="0.0000;0.0000;0.0542;0.1375;0.1542;1.0000" values="0;0;440;440;0;0"/></rect></clipPath>
    <g clip-path="url(#c0)"><text x="82" y="266" class="role" textLength="432" lengthAdjust="spacing">Fullstack &amp; FiveM Developer</text></g>
    <rect y="240" width="3" height="32" fill="#22d3ee" opacity="0">
      <animate attributeName="x" dur="24.0s" repeatCount="indefinite"
        keyTimes="0.0000;0.0000;0.0542;0.1375;0.1542;1.0000" values="82;82;522;522;82;82"/>
      <animate attributeName="opacity" dur="24.0s" repeatCount="indefinite" calcMode="discrete"
        keyTimes="0;0.0000;0.1583" values="0;1;0"/></rect>
    <clipPath id="c1"><rect x="80" y="236" height="40" width="0">
      <animate attributeName="width" dur="24.0s" repeatCount="indefinite" calcMode="linear"
        keyTimes="0.0000;0.1667;0.2208;0.3042;0.3208;1.0000" values="0;0;408;408;0;0"/></rect></clipPath>
    <g clip-path="url(#c1)"><text x="82" y="266" class="role" textLength="400" lengthAdjust="spacing">TypeScript · Next.js · Go</text></g>
    <rect y="240" width="3" height="32" fill="#22d3ee" opacity="0">
      <animate attributeName="x" dur="24.0s" repeatCount="indefinite"
        keyTimes="0.0000;0.1667;0.2208;0.3042;0.3208;1.0000" values="82;82;490;490;82;82"/>
      <animate attributeName="opacity" dur="24.0s" repeatCount="indefinite" calcMode="discrete"
        keyTimes="0;0.1667;0.3250" values="0;1;0"/></rect>
    <clipPath id="c2"><rect x="80" y="236" height="40" width="0">
      <animate attributeName="width" dur="24.0s" repeatCount="indefinite" calcMode="linear"
        keyTimes="0.0000;0.3333;0.3875;0.4708;0.4875;1.0000" values="0;0;408;408;0;0"/></rect></clipPath>
    <g clip-path="url(#c2)"><text x="82" y="266" class="role" textLength="400" lengthAdjust="spacing">FiveM scripts · Lua · NUI</text></g>
    <rect y="240" width="3" height="32" fill="#22d3ee" opacity="0">
      <animate attributeName="x" dur="24.0s" repeatCount="indefinite"
        keyTimes="0.0000;0.3333;0.3875;0.4708;0.4875;1.0000" values="82;82;490;490;82;82"/>
      <animate attributeName="opacity" dur="24.0s" repeatCount="indefinite" calcMode="discrete"
        keyTimes="0;0.3333;0.4917" values="0;1;0"/></rect>
    <clipPath id="c3"><rect x="80" y="236" height="40" width="0">
      <animate attributeName="width" dur="24.0s" repeatCount="indefinite" calcMode="linear"
        keyTimes="0.0000;0.5000;0.5542;0.6375;0.6542;1.0000" values="0;0;456;456;0;0"/></rect></clipPath>
    <g clip-path="url(#c3)"><text x="82" y="266" class="role" textLength="448" lengthAdjust="spacing">Apprentice @ Orange Business</text></g>
    <rect y="240" width="3" height="32" fill="#22d3ee" opacity="0">
      <animate attributeName="x" dur="24.0s" repeatCount="indefinite"
        keyTimes="0.0000;0.5000;0.5542;0.6375;0.6542;1.0000" values="82;82;538;538;82;82"/>
      <animate attributeName="opacity" dur="24.0s" repeatCount="indefinite" calcMode="discrete"
        keyTimes="0;0.5000;0.6583" values="0;1;0"/></rect>
    <clipPath id="c4"><rect x="80" y="236" height="40" width="0">
      <animate attributeName="width" dur="24.0s" repeatCount="indefinite" calcMode="linear"
        keyTimes="0.0000;0.6667;0.7208;0.8042;0.8208;1.0000" values="0;0;472;472;0;0"/></rect></clipPath>
    <g clip-path="url(#c4)"><text x="82" y="266" class="role" textLength="464" lengthAdjust="spacing">Discord bots · Live broadcast</text></g>
    <rect y="240" width="3" height="32" fill="#22d3ee" opacity="0">
      <animate attributeName="x" dur="24.0s" repeatCount="indefinite"
        keyTimes="0.0000;0.6667;0.7208;0.8042;0.8208;1.0000" values="82;82;554;554;82;82"/>
      <animate attributeName="opacity" dur="24.0s" repeatCount="indefinite" calcMode="discrete"
        keyTimes="0;0.6667;0.8250" values="0;1;0"/></rect>
    <clipPath id="c5"><rect x="80" y="236" height="40" width="0">
      <animate attributeName="width" dur="24.0s" repeatCount="indefinite" calcMode="linear"
        keyTimes="0.0000;0.8333;0.8875;0.9708;0.9875;1.0000" values="0;0;584;584;0;0"/></rect></clipPath>
    <g clip-path="url(#c5)"><text x="82" y="266" class="role" textLength="576" lengthAdjust="spacing">AI-augmented dev · Claude Code · MCP</text></g>
    <rect y="240" width="3" height="32" fill="#22d3ee" opacity="0">
      <animate attributeName="x" dur="24.0s" repeatCount="indefinite"
        keyTimes="0.0000;0.8333;0.8875;0.9708;0.9875;1.0000" values="82;82;666;666;82;82"/>
      <animate attributeName="opacity" dur="24.0s" repeatCount="indefinite" calcMode="discrete"
        keyTimes="0;0.8333;0.9917" values="0;1;0"/></rect>

    <g class="fade" style="animation-delay:.8s">
      <rect x="80" y="310" width="186" height="38" rx="19" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".12"/>
      <path d="M104 321a7 7 0 0 1 14 0c0 5-7 13-7 13s-7-8-7-13z" fill="#f472b6"/><circle cx="111" cy="321" r="2.5" fill="#0b0f19"/>
      <text x="126" y="335" class="chip">Bordeaux, France</text>
      <rect x="278" y="310" width="210" height="38" rx="19" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".12"/>
      <rect x="298" y="321" width="16" height="12" rx="2" fill="#ff7900"/><rect x="302" y="317" width="8" height="5" rx="1.5" stroke="#ff7900" stroke-width="2"/>
      <text x="322" y="335" class="chip">Orange Business</text>
      <rect x="500" y="310" width="192" height="38" rx="19" fill="#34d399" fill-opacity=".1" stroke="#34d399" stroke-opacity=".4"/>
      <circle cx="522" cy="329" r="5" fill="#34d399"><animate attributeName="opacity" values="1;.2;1" dur="1.6s" repeatCount="indefinite"/></circle>
      <text x="536" y="335" class="chip" fill="#34d399">Always building</text>
    </g>
  </g>
  <rect x=".5" y=".5" width="1199" height="399" rx="23.5" stroke="#ffffff" stroke-opacity=".08"/>
</svg>

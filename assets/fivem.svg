<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="704" viewBox="0 0 1200 704" fill="none">
  <style>
    .h  { font: 800 40px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #f0f6fc; }
    .s  { font: 400 17px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #9da7b3; }
    .pv { font: 800 26px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #f40552; }
    .pl { font: 500 14px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #8b949e; }
    .tt { font: 800 21px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #f0f6fc; }
    .ts { font: 600 13px 'JetBrains Mono', 'Fira Code', 'Cascadia Code', Consolas, 'Courier New', monospace; fill: #f40552; letter-spacing: .5px; }
    .td { font: 400 15.5px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #9da7b3; }
    .tk { font: 600 12.5px 'JetBrains Mono', 'Fira Code', 'Cascadia Code', Consolas, 'Courier New', monospace; fill: #6e7681; }
    .in { opacity: 0; animation: in .6s ease-out forwards; }
    @keyframes in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    .glow { animation: g 7s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes g { 0%,100% { opacity: .35; transform: scale(1); } 50% { opacity: .6; transform: scale(1.15); } }
    .scan { animation: scan 6s linear infinite; }
    @keyframes scan { from { transform: translateY(-40px); } to { transform: translateY(744px); } }
  </style>
  <defs>
    <radialGradient id="rg"><stop stop-color="#f40552"/><stop offset="1" stop-color="#f40552" stop-opacity="0"/></radialGradient>
    <linearGradient id="bd" x1="0" y1="0" x2="1200" y2="704" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f40552" stop-opacity=".9"/><stop offset=".4" stop-color="#30363d"/><stop offset="1" stop-color="#30363d"/>
    </linearGradient>
    <linearGradient id="sc" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f40552" stop-opacity="0"/><stop offset="1" stop-color="#f40552" stop-opacity=".08"/></linearGradient>
    <clipPath id="cl"><rect x="1" y="1" width="1198" height="702" rx="20"/></clipPath>
  </defs>

  <text x="126" y="82" class="h">FiveM Developer</text>
  <text x="128" y="112" class="s">Scripts, resources and live-show tooling for GTA V roleplay servers and in-game events.</text>
  <path d="M40 152H1160" stroke="#21262d"/>
  <g class="in" style="animation-delay:0.2s"><text x="48" y="196" class="pv">4</text><text x="48" y="222" class="pl">public FiveM &amp; RP repos, more private</text></g><g class="in" style="animation-delay:0.3s"><text x="328" y="196" class="pv">Lua · TS · C#</text><text x="328" y="222" class="pl">client &amp; server scripts</text></g><g class="in" style="animation-delay:0.4s"><text x="608" y="196" class="pv">React</text><text x="608" y="222" class="pl">NUI &amp; in-game DUI screens</text></g><g class="in" style="animation-delay:0.5s"><text x="888" y="196" class="pv">Live</text><text x="888" y="222" class="pl">stage &amp; broadcast tooling</text></g>
  
  <g class="in" style="animation-delay:.45s">

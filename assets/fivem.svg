    <text x="1136" y="293" text-anchor="end" class="ts">mindcity-rp.fr ↗</text>
  </g>
  <g class="in" style="animation-delay:0.50s"><rect x="40" y="346" width="550" height="150" rx="14" fill="#ffffff" fill-opacity=".03" stroke="#ffffff" stroke-opacity=".08"/><rect x="40" y="368" width="3" height="40" rx="1.5" fill="#f40552"/><text x="64" y="386" class="tt">Régie</text><text x="64" y="408" class="ts">stage-light &amp; show control</text><text x="64" y="440" class="td">Lights, lasers, FX, DUI screens and IPLs</text><text x="64" y="462" class="td">per zone — master/slave over WebSocket.</text><text x="566" y="386" text-anchor="end" class="tk">TypeScript · Bun · React</text><rect x="480" y="454" width="86" height="24" rx="12" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".18"/><rect x="492" y="466" width="10" height="8" rx="1.5" fill="#8b949e"/><path d="M494 466v-2.5a3 3 0 0 1 6 0v2.5" stroke="#8b949e" stroke-width="1.6"/><text x="508" y="471" class="tk" fill="#8b949e">private</text></g><g class="in" style="animation-delay:0.62s"><rect x="610" y="346" width="550" height="150" rx="14" fill="#ffffff" fill-opacity=".03" stroke="#ffffff" stroke-opacity=".08"/><rect x="610" y="368" width="3" height="40" rx="1.5" fill="#f40552"/><text x="634" y="386" class="tt">Race Leaderboard</text><text x="634" y="408" class="ts">F1-style broadcast overlay</text><text x="634" y="440" class="td">Live standings for OBS: one poller per race,</text><text x="634" y="462" class="td">changes pushed to every source over SSE.</text><text x="1136" y="386" text-anchor="end" class="tk">Bun · React · SSE</text><rect x="1050" y="454" width="86" height="24" rx="12" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".18"/><rect x="1062" y="466" width="10" height="8" rx="1.5" fill="#8b949e"/><path d="M1064 466v-2.5a3 3 0 0 1 6 0v2.5" stroke="#8b949e" stroke-width="1.6"/><text x="1078" y="471" class="tk" fill="#8b949e">private</text></g><g class="in" style="animation-delay:0.74s"><rect x="40" y="514" width="550" height="150" rx="14" fill="#ffffff" fill-opacity=".03" stroke="#ffffff" stroke-opacity=".08"/><rect x="40" y="536" width="3" height="40" rx="1.5" fill="#f40552"/><text x="64" y="554" class="tt">Camera scripts</text><text x="64" y="576" class="ts">in-game broadcast direction</text><text x="64" y="608" class="td">Static &amp; free cameras switched live</text><text x="64" y="630" class="td">from the keyboard — built for productions.</text><text x="566" y="554" text-anchor="end" class="tk">Lua · ★ 3</text></g><g class="in" style="animation-delay:0.86s"><rect x="610" y="514" width="550" height="150" rx="14" fill="#ffffff" fill-opacity=".03" stroke="#ffffff" stroke-opacity=".08"/><rect x="610" y="536" width="3" height="40" rx="1.5" fill="#f40552"/><text x="634" y="554" class="tt">NPC &amp; RP tools</text><text x="634" y="576" class="ts">servers, quests, dispatch</text><text x="634" y="608" class="td">Quest NPCs with interactions, a custom RP</text><text x="634" y="630" class="td">server, LSMS Discord bot and dispatch panels.</text><text x="1136" y="554" text-anchor="end" class="tk">Lua · JS · Python</text></g>

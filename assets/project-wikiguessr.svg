<svg xmlns="http://www.w3.org/2000/svg" width="590" height="236" viewBox="0 0 590 236" fill="none">
  <style>
    .t    { font: 800 28px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #f0f6fc; }
    .desc { font: 400 16.5px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #9da7b3; }
    .chip { font: 600 13px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #c9d1d9; }
    .bdg  { font: 700 13px 'JetBrains Mono', 'Fira Code', 'Cascadia Code', Consolas, 'Courier New', monospace; }
    .glow { animation: g 6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes g { 0%,100% { opacity: .35; transform: scale(1); } 50% { opacity: .6; transform: scale(1.2); } }
    .sh { animation: sh 5s ease-in-out infinite; }
    @keyframes sh { 0% { transform: translateX(-700px); } 60%,100% { transform: translateX(700px); } }
  </style>
  <defs>
    <radialGradient id="rg"><stop stop-color="#22d3ee"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
    <linearGradient id="bd" x1="0" y1="0" x2="590" y2="236" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22d3ee" stop-opacity=".8"/><stop offset=".45" stop-color="#30363d"/><stop offset="1" stop-color="#30363d"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".06"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="cl"><rect x="1" y="1" width="588" height="234" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#cl)">
    <rect width="590" height="236" fill="#0d1117"/>
    <circle cx="560" cy="10" r="170" fill="url(#rg)" class="glow"/>
    <rect class="sh" x="0" y="0" width="220" height="236" fill="url(#shine)" transform="skewX(-20)"/>
  </g>
  <rect x="1" y="1" width="588" height="234" rx="18" stroke="url(#bd)" stroke-width="1.5"/>
  <rect x="32" y="32" width="48" height="48" rx="12" fill="#22d3ee" fill-opacity=".14" stroke="#22d3ee" stroke-opacity=".5"/>
  <text x="56" y="65" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', 'Cascadia Code', Consolas, 'Courier New', monospace" font-weight="800" font-size="22" fill="#22d3ee">W?</text>
  <text x="96" y="66" class="t">WikiGuessr</text>
  <rect x="484" y="38" width="74" height="28" rx="14" fill="#22d3ee" fill-opacity=".12"/>
  <text x="521.0" y="57" text-anchor="middle" class="bdg" fill="#22d3ee">● live</text>
  <text x="32" y="118" class="desc">Daily browser game — can you find</text><text x="32" y="144" class="desc">today&#x27;s hidden Wikipedia page?</text>
  <rect x="32" y="178" width="91" height="30" rx="15" fill="#e6edf3" fill-opacity=".12" stroke="#e6edf3" stroke-opacity=".45"/><circle cx="47" cy="193" r="4.5" fill="#e6edf3"/><text x="58" y="198" class="chip">Next.js</text><rect x="133" y="178" width="100" height="30" rx="15" fill="#3ecf8e" fill-opacity=".12" stroke="#3ecf8e" stroke-opacity=".45"/><circle cx="148" cy="193" r="4.5" fill="#3ecf8e"/><text x="159" y="198" class="chip">Supabase</text><rect x="243" y="178" width="83" height="30" rx="15" fill="#5a67d8" fill-opacity=".12" stroke="#5a67d8" stroke-opacity=".45"/><circle cx="258" cy="193" r="4.5" fill="#5a67d8"/><text x="269" y="198" class="chip">Prisma</text><rect x="336" y="178" width="116" height="30" rx="15" fill="#336791" fill-opacity=".12" stroke="#336791" stroke-opacity=".45"/><circle cx="351" cy="193" r="4.5" fill="#336791"/><text x="362" y="198" class="chip">PostgreSQL</text>
</svg>

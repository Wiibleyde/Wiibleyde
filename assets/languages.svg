<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="350" viewBox="0 0 1200 350" fill="none">
  <style>
    .title { font: 700 24px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #e6edf3; }
    .sub   { font: 400 15px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #8b949e; }
    .lname { font: 600 16px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #c9d1d9; }
    .lpct  { font: 500 15px 'JetBrains Mono', 'Fira Code', 'Cascadia Code', Consolas, 'Courier New', monospace; fill: #8b949e; }
    .big   { font: 800 40px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
    .small { font: 500 15px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #8b949e; }
    .seg { transform: scaleX(0); animation: grow .8s cubic-bezier(.2,.8,.2,1) forwards; }
    @keyframes grow { to { transform: scaleX(1); } }
    .lg { opacity: 0; animation: in .6s ease-out forwards; }
    @keyframes in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  </style>
  <rect x="1" y="1" width="1198" height="348" rx="18" fill="#0d1117" stroke="#30363d"/>
  <text x="40" y="60" class="title">What I build with</text>
  <text x="40" y="88" class="sub">Primary language across my public repositories — pulled from the GitHub API</text>
  <rect x="40" y="118" width="1120" height="18" rx="4" fill="#161b22"/>
  <rect x="40.0" y="118" width="356.0" height="18" rx="4" fill="#10b981" class="seg" style="animation-delay:0.10s;transform-origin:40.0px 127px"/><rect x="399.0" y="118" width="298.5" height="18" rx="4" fill="#3178c6" class="seg" style="animation-delay:0.22s;transform-origin:399.0px 127px"/><rect x="700.5" y="118" width="97.5" height="18" rx="4" fill="#00ADD8" class="seg" style="animation-delay:0.34s;transform-origin:700.5px 127px"/><rect x="801.0" y="118" width="68.8" height="18" rx="4" fill="#9b4f96" class="seg" style="animation-delay:0.46s;transform-origin:801.0px 127px"/><rect x="872.8" y="118" width="54.4" height="18" rx="4" fill="#f7df1e" class="seg" style="animation-delay:0.58s;transform-origin:872.8px 127px"/><rect x="930.3" y="118" width="54.4" height="18" rx="4" fill="#5b6bff" class="seg" style="animation-delay:0.70s;transform-origin:930.3px 127px"/><rect x="987.7" y="118" width="169.3" height="18" rx="4" fill="#6e7681" class="seg" style="animation-delay:0.82s;transform-origin:987.7px 127px"/>
  <g class="lg" style="animation-delay:0.60s"><circle cx="47" cy="174" r="7" fill="#10b981"/><text x="64" y="180" class="lname">Python</text><text x="190" y="180" class="lpct">32.1%</text></g><g class="lg" style="animation-delay:0.68s"><circle cx="332" cy="174" r="7" fill="#3178c6"/><text x="349" y="180" class="lname">TypeScript</text><text x="475" y="180" class="lpct">26.9%</text></g><g class="lg" style="animation-delay:0.76s"><circle cx="617" cy="174" r="7" fill="#00ADD8"/><text x="634" y="180" class="lname">Go</text><text x="760" y="180" class="lpct">9.0%</text></g><g class="lg" style="animation-delay:0.84s"><circle cx="902" cy="174" r="7" fill="#9b4f96"/><text x="919" y="180" class="lname">C#</text><text x="1045" y="180" class="lpct">6.4%</text></g><g class="lg" style="animation-delay:0.92s"><circle cx="47" cy="208" r="7" fill="#f7df1e"/><text x="64" y="214" class="lname">JavaScript</text><text x="190" y="214" class="lpct">5.1%</text></g><g class="lg" style="animation-delay:1.00s"><circle cx="332" cy="208" r="7" fill="#5b6bff"/><text x="349" y="214" class="lname">Lua</text><text x="475" y="214" class="lpct">5.1%</text></g><g class="lg" style="animation-delay:1.08s"><circle cx="617" cy="208" r="7" fill="#6e7681"/><text x="634" y="214" class="lname">Other</text><text x="760" y="214" class="lpct">15.4%</text></g>

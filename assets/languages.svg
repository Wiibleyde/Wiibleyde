  <g class="lg" style="animation-delay:0.60s"><circle cx="47" cy="174" r="7" fill="#3178c6"/><text x="64" y="180" class="lname">TypeScript</text><text x="190" y="180" class="lpct">35.5%</text></g><g class="lg" style="animation-delay:0.68s"><circle cx="332" cy="174" r="7" fill="#ffd43b"/><text x="349" y="180" class="lname">Python</text><text x="475" y="180" class="lpct">28.2%</text></g><g class="lg" style="animation-delay:0.76s"><circle cx="617" cy="174" r="7" fill="#00ADD8"/><text x="634" y="180" class="lname">Go</text><text x="760" y="180" class="lpct">8.2%</text></g><g class="lg" style="animation-delay:0.84s"><circle cx="902" cy="174" r="7" fill="#f7df1e"/><text x="919" y="180" class="lname">JavaScript</text><text x="1045" y="180" class="lpct">5.5%</text></g><g class="lg" style="animation-delay:0.92s"><circle cx="47" cy="208" r="7" fill="#9b4f96"/><text x="64" y="214" class="lname">C#</text><text x="190" y="214" class="lpct">5.5%</text></g><g class="lg" style="animation-delay:1.00s"><circle cx="332" cy="208" r="7" fill="#5b6bff"/><text x="349" y="214" class="lname">Lua</text><text x="475" y="214" class="lpct">4.5%</text></g><g class="lg" style="animation-delay:1.08s"><circle cx="617" cy="208" r="7" fill="#6e7681"/><text x="634" y="214" class="lname">Other</text><text x="760" y="214" class="lpct">12.7%</text></g>
